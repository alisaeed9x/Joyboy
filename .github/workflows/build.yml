name: Build Debug APK
on:
  push:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-tv-${{ github.ref_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  jvm-tests:   # P12: بيشغّل اختبارات الـ JVM النقية على Actions (مفيش kotlinc في جلسات Claude). غير متحقق من إنه شغّال لسه.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Kotlin compiler 2.4.0
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.0/kotlin-compiler-2.4.0.zip
          unzip -q kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run JVM tests
        run: sh dev-tests/run_tests.sh
