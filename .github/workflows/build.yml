name: Build Universal Debug APK only
on:
  push:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build Universal Debug APK only
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: subtitler-main-universal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  verify:
    # (v587 / Phase G) فحوصات جانبية — مش بتوقّف بناء الـ APK (continue-on-error)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: kt_manifest يطابق ملفات .kt الفعلية
        run: |
          find app/src -name '*.kt' | sed 's|^app/||; s|^src/main/java/||' | sort > /tmp/tree.txt
          sed 's|^app/||' app/kt_manifest.txt | sort > /tmp/man.txt
          diff /tmp/man.txt /tmp/tree.txt && echo "manifest OK"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Android Lint (UnusedResources وغيره)
        run: gradle lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
