name: Build APK
# (v857) بعد كل بيلد ناجح: بيعمل Release فيه الـAPK (تبويب Releases في الريبو) + لسه بيرفع الـartifact زي الأول.
# بيحتفظ بآخر 30 ريليز بس (الأقدم بيتمسح مع التاج بتاعه).
on:
  push:
    paths-ignore: ['patches/**']   # رفع الـpatch ملوش بيلد؛ apply-patch هو اللي بيشغّله
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # لازم عشان إنشاء الـRelease (الافتراضي كان read بس)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Swap + resources (v877)
        run: |
          free -m; nproc
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          free -m
      - name: Detect what changed (v1257)
        id: chg
        run: |
          APP=true; PLG=true
          CH=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if [ -n "$CH" ]; then
            APP=false; PLG=false
            if echo "$CH" | grep -qE '^(app/|meetube/|build\.gradle|settings\.gradle|versions\.gradle|gradle\.properties|gradle/)'; then APP=true; fi
            if echo "$CH" | grep -qE '^(plugin-aniyomi/|build\.gradle|settings\.gradle|versions\.gradle|gradle\.properties|gradle/)'; then PLG=true; fi
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "plugin=$PLG" >> "$GITHUB_OUTPUT"
          echo "changed: app=$APP plugin=$PLG"
      - name: Build Debug APKs (v1302: ABI splits + universal)
        if: steps.chg.outputs.app == 'true'
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          ls -la app/build/outputs/apk/debug/
      - name: Report build errors (annotation)
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { grep -E '^e: |error:|FAILED|What went wrong|Execution failed|Could not|Unresolved|AAPT|Exception' build.log | head -60; echo '--- tail ---'; tail -40 build.log; } > err.txt
          MSG=$(python3 -c "s=open('err.txt',encoding='utf-8',errors='replace').read()[:14000]; print(s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=BUILD_FAILED::$MSG"
      - name: Why did it die (v877)
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -i -E "out of memory|killed process" | tail -8 || true
      - name: Upload APK artifact
        if: steps.chg.outputs.app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subtitler-${{ github.ref_name }}-universal-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish Release
        if: success() && steps.chg.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(ls CHANGES_v*.md | sed -E 's/CHANGES_v([0-9]+)\.md/\1/' | sort -n | tail -1)
          NAME="$((VER / 100)).$(printf '%02d' $((VER % 100)))"
          # (v1302) كل الـAPKs (arm64-v8a · armeabi-v7a · universal) بتترفع على الريليز باسم فيه المعمارية
          OUTS=()
          for APK in app/build/outputs/apk/debug/*.apk; do
            B=$(basename "$APK")
            SUF=""
            case "$B" in
              *arm64-v8a*) SUF="arm64-v8a";;
              *armeabi-v7a*) SUF="armeabi-v7a";;
              *universal*) SUF="universal";;
            esac
            OUT="Joyboy-v${NAME}-build${{ github.run_number }}${SUF:+-$SUF}.apk"
            cp "$APK" "$OUT"
            OUTS+=("$OUT")
          done
          # (v1190) ملاحظات الريليز = كل الـChangelogs الأحدث من آخر ريليز (الأحدث فوق)
          PREVREL=$(gh release list --limit 30 --json name,tagName --jq '[.[] | select(.tagName | startswith("build-"))][0].name' 2>/dev/null | sed -nE 's/^Joyboy v([0-9]+)\.([0-9]+).*/\1\2/p')
          : > NOTES.md
          for v in $(ls CHANGES_v*.md | sed -E 's/CHANGES_v([0-9]+)\.md/\1/' | sort -rn); do
            if [ -z "$PREVREL" ] || [ "$v" -gt "$PREVREL" ]; then cat "CHANGES_v$v.md" >> NOTES.md; printf '\n\n---\n\n' >> NOTES.md; fi
          done
          [ -s NOTES.md ] || cp "CHANGES_v${VER}.md" NOTES.md
          head -c 100000 NOTES.md | iconv -c -f UTF-8 -t UTF-8 > NOTES_cut.md
          FLAGS="--latest"
          if [ "${{ github.ref_name }}" != "main" ]; then FLAGS="--prerelease"; fi
          gh release create "build-${{ github.run_number }}" "${OUTS[@]}" \
            --target "${{ github.sha }}" \
            --title "Joyboy v${NAME} (build ${{ github.run_number }}) · ${{ github.ref_name }}" \
            --notes-file NOTES_cut.md $FLAGS
          # تنضيف: آخر 30 ريليز بيلد بس
          gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("build-"))][30:][].tagName' \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
      - name: Build plugin APK (v1257)
        id: pb
        if: ${{ !cancelled() && steps.chg.outputs.plugin == 'true' }}
        run: |
          set -o pipefail
          export JB_PLUGIN_VC=$(( $(date +%s) / 60 ))
          export JB_PLUGIN_VN="1.${{ github.run_number }}"
          echo "JB_PLUGIN_VC=$JB_PLUGIN_VC" >> "$GITHUB_ENV"
          echo "JB_PLUGIN_VN=$JB_PLUGIN_VN" >> "$GITHUB_ENV"
          gradle :plugin-aniyomi:assembleDebug --stacktrace --console=plain 2>&1 | tee build-plugin.log
      - name: Report plugin build errors (annotation)
        if: ${{ failure() && steps.pb.outcome == 'failure' }}
        run: |
          [ -f build-plugin.log ] || exit 0
          { grep -E '^e: |error:|FAILED|What went wrong|Execution failed|Could not|Unresolved|AAPT|Exception' build-plugin.log | head -60; echo '--- tail ---'; tail -40 build-plugin.log; } > err-plugin.txt
          MSG=$(python3 -c "s=open('err-plugin.txt',encoding='utf-8',errors='replace').read()[:14000]; print(s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=PLUGIN_BUILD_FAILED::$MSG"
      - name: Publish plugin release (v1257)
        if: ${{ !cancelled() && steps.pb.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=plugin-aniyomi/build/outputs/apk/debug/plugin-aniyomi-debug.apk
          test -f "$APK"
          cp "$APK" aniyomi-plugin.apk
          SHA=$(sha256sum aniyomi-plugin.apk | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/plugin-aniyomi/aniyomi-plugin.apk"
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s","url":"%s"}\n' "$JB_PLUGIN_VC" "$JB_PLUGIN_VN" "$SHA" "$URL" > plugin.json
          gh release delete plugin-aniyomi --cleanup-tag --yes || true
          gh release create plugin-aniyomi aniyomi-plugin.apk plugin.json \
            --target "${{ github.sha }}" \
            --title "Joyboy plugin: Aniyomi engine v${JB_PLUGIN_VN}" \
            --notes "Plugin APK for Joyboy (installed from the Plugins page). Not an app update." \
            --latest=false
