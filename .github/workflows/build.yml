name: Build APK
# (v857) بعد كل بيلد ناجح: بيعمل Release فيه الـAPK (تبويب Releases في الريبو) + لسه بيرفع الـartifact زي الأول.
# بيحتفظ بآخر 10 ريليزات بس (الأقدم بيتمسح مع التاج بتاعه).
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # لازم عشان إنشاء الـRelease (الافتراضي كان read بس)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Swap + resources (v877)
        run: |
          free -m; nproc
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          free -m
      - name: Build Universal Debug APK only
        run: gradle assembleDebug --stacktrace
      - name: Why did it die (v877)
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -i -E "out of memory|killed process" | tail -8 || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitler-${{ github.ref_name }}-universal-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(ls CHANGES_v*.md | sed -E 's/CHANGES_v([0-9]+)\.md/\1/' | sort -n | tail -1)
          NAME="$((VER / 100)).$(printf '%02d' $((VER % 100)))"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          OUT="Joyboy-v${NAME}-build${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          FLAGS="--latest"
          if [ "${{ github.ref_name }}" != "main" ]; then FLAGS="--prerelease"; fi
          gh release create "build-${{ github.run_number }}" "$OUT" \
            --target "${{ github.sha }}" \
            --title "Joyboy v${NAME} (build ${{ github.run_number }}) · ${{ github.ref_name }}" \
            --notes-file "CHANGES_v${VER}.md" $FLAGS
          # تنضيف: آخر 10 ريليزات بيلد بس
          gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("build-"))][10:][].tagName' \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
