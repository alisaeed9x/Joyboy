// (v878) الجذر: Joyboy (:app) + مودولات MeeTube. الإعدادات المشتركة (إصدارات المكتبات) من meetube/SharedModules/constants.gradle
apply from: gradle.ext.sharedModulesConstants

buildscript {
    apply from: gradle.ext.sharedModulesConstants
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.2 فيه كومبايلر كوتلن مدمج — مفيش بلجن kotlin-android منفصل (نفس بناء MeeTube)
        classpath 'com.android.tools.build:gradle:9.2.1'
        // (v1083) كوتلن المدمج في AGP 9.2.1 بيرجع لـ2.2.10 لوحده، و produceDebugComposeMapping بيدوّر على compose-group-mapping:2.2.10 (مش موجود). تثبيت KGP على 2.3.21 يخلي المدمج يستخدم نفس نسخة بلجن الكومبوز.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    configurations.all {
        resolutionStrategy.force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + kotlinxVersion
        resolutionStrategy.force 'org.chromium.net:cronet-api:' + cronetApiVersion
    }
}
