android.useAndroidX=true
# (v878) MeeTube: مودولات كتيرة بتشاور على R بعض
android.nonTransitiveRClass=false
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# (v458) سرعة البناء
org.gradle.parallel=false
# (v877) ذاكرة الرانر محدودة
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.incremental=true

# (v1040) المعماريتين: arm64 + armeabi-v7a — أغلب أجهزة أندرويد تي في (وبوكسات الريسيفر) 32-bit ومش بتتثبّت على arm64 بس (INSTALL_FAILED_NO_MATCHING_ABIS). لو عاوز arm64 بس: joyAbi=arm64-v8a
joyAbi=arm64-v8a,armeabi-v7a

# (v1028) تصغير R8 + الموارد حتى في debug (الـCI بيبني debug). لو باظ: joyMinify=false
joyMinify=true
