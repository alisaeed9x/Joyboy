<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyboy Actions</title>
<style>
  :root{
    --bg:#101215; --card:#181b20; --line:#272b33; --text:#e8eaed; --muted:#9aa0a6;
    --ok:#2e9e5b; --okbg:#12251a; --bad:#e5534b; --badbg:#2a1517; --run:#d9a21b; --runbg:#2a2412; --gray:#6b7280;
    --btn:#1f5fbf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif}
  .wrap{max-width:460px;margin:0 auto;padding:10px}
  header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1 small{color:var(--muted);font-weight:400;font-size:11px;display:block;direction:ltr;text-align:right}
  button,.btn{font:inherit;color:#fff;border:0;border-radius:9px;padding:7px 11px;cursor:pointer;background:#2b3038;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  button:hover,.btn:hover{filter:brightness(1.15)}
  #refresh{background:var(--btn);font-weight:600}
  #refresh.spin .ic{display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin:2px 2px 8px}
  .meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .run{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--gray);border-radius:11px;padding:8px 10px;margin-bottom:7px}
  .run.success{border-right-color:var(--ok)} .run.failure{border-right-color:var(--bad)} .run.running{border-right-color:var(--run);background:var(--runbg)}
  .num{font-size:20px;font-weight:700;min-width:58px;font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
  .num small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
  .mid{flex:1;min-width:0}
  .mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .mid .s{color:var(--muted);font-size:11.5px;margin-top:2px}
  .st{font-weight:600}
  .success .st{color:var(--ok)} .failure .st{color:var(--bad)} .running .st{color:var(--run)}
  .acts{display:flex;flex-direction:column;gap:4px}
  .dl{background:var(--ok);font-weight:600;padding:6px 10px}
  .lg{background:var(--bad);font-weight:600;padding:6px 10px}
  .off{background:#3a3f48;color:#aaa;pointer-events:none}
  .pulse{animation:pl 1.2s ease-in-out infinite}
  @keyframes pl{50%{opacity:.35}}
  .msg{background:var(--badbg);border:1px solid #5a2a2e;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;white-space:pre-wrap}
  .empty{color:var(--muted);text-align:center;padding:26px 0}
  #cfg{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  #cfg label{display:block;font-size:12px;color:var(--muted);margin:7px 0 3px}
  #cfg input,#cfg select{width:100%;background:#0e1013;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;direction:ltr;text-align:left}
  #cfg .row{display:flex;gap:8px;margin-top:10px}
  #cfg .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.55}
  footer{color:var(--muted);font-size:10.5px;text-align:center;margin-top:6px;direction:ltr}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚙ Workflows <small id="repoLbl"></small></h1>
    <button id="gear" title="إعدادات">⚙</button>
    <button id="refresh" title="تحديث"><span class="ic">⟳</span> تحديث</button>
  </header>

  <div id="cfg">
    <label>المستودع (owner/repo)</label>
    <input id="cRepo" placeholder="alisaeed9x/Joyboy" spellcheck="false">
    <label>GitHub token (اختياري — لازم لو المستودع برايفت، ويزوّد حد الطلبات)</label>
    <input id="cTok" type="password" placeholder="ghp_… أو github_pat_…" spellcheck="false" autocomplete="off">
    <label>التحديث التلقائي</label>
    <select id="cInt">
      <option value="0">إيقاف (يدوي بس)</option><option value="30">كل 30 ثانية</option><option value="60">كل دقيقة</option>
      <option value="120">كل دقيقتين</option><option value="300">كل 5 دقايق</option>
    </select>
    <label>عدد الـ runs المعروضة</label>
    <select id="cCnt"><option>6</option><option>8</option><option>10</option><option>15</option><option>20</option></select>
    <div class="row"><button id="cSave" style="background:var(--btn);flex:1">حفظ وتحديث</button><button id="cClose">إغلاق</button></div>
    <div class="hint">
      التوكن بيتخزّن في المتصفح ده بس (localStorage) ومابيتبعتش لأي مكان غير api.github.com. الصلاحية المطلوبة: <b dir="ltr">Actions: Read</b> (fine-grained) أو <b dir="ltr">repo</b> (classic).<br>
      أزرار التحميل بتفتح لينكات github.com مباشرة — لازم تكون مسجّل دخول على GitHub في نفس المتصفح.
    </div>
  </div>

  <div class="meta"><span>آخر تحديث: <b id="ago">—</b></span><span id="rate"></span></div>
  <div id="err"></div>
  <div id="list"><div class="empty">بحمّل…</div></div>
  <footer id="foot"></footer>
</div>

<script>
(function(){
  'use strict';
  var LS = { get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
             set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
  var $ = function(id){ return document.getElementById(id); };

  var S = {
    repo: LS.get('jaw_repo','alisaeed9x/Joyboy'),
    tok: LS.get('jaw_tok',''),
    interval: parseInt(LS.get('jaw_int','60'),10),
    count: parseInt(LS.get('jaw_cnt','10'),10),
    last: 0, runs: [], busy:false, timer:null, rate:'', art: {}
  };
  try{ S.art = JSON.parse(LS.get('jaw_art','{}')) || {}; }catch(e){ S.art = {}; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function dur(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m>=60 ? Math.floor(m/60)+'س '+pad(m%60)+'د' : m+':'+pad(s); }
  function agoTxt(ms){
    var s=Math.max(0,Math.round(ms/1000));
    if(s<60) return s+' ث';
    var m=Math.floor(s/60); if(m<60) return m+' د '+pad(s%60)+' ث';
    var h=Math.floor(m/60); if(h<24) return h+' س '+pad(m%60)+' د';
    return Math.floor(h/24)+' يوم';
  }
  function sinceTxt(iso){ return iso ? 'من '+agoTxt(Date.now()-new Date(iso).getTime()) : ''; }

  // رقم الملف: 1081 / 1082 … من عنوان الـ run أو رسالة الكوميت؛ وإلا رقم الـ run
  function fileNo(r){
    var srcs=[r.display_title, r.head_commit && r.head_commit.message, r.name];
    var i, m;
    for(i=0;i<srcs.length;i++){ if(srcs[i]){ m=/v(\d{3,5})/i.exec(srcs[i]); if(m) return m[1]; } }
    for(i=0;i<srcs.length;i++){ if(srcs[i]){ m=/(\d{4})/.exec(srcs[i]); if(m) return m[1]; } }
    return null;
  }

  function kind(r){
    if(r.status!=='completed') return 'running';
    if(r.conclusion==='success') return 'success';
    if(r.conclusion==='cancelled' || r.conclusion==='skipped' || r.conclusion==='neutral') return 'gray';
    return 'failure';
  }

  function headers(){
    var h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    if(S.tok) h['Authorization']='Bearer '+S.tok;
    return h;
  }
  function api(path){
    return fetch('https://api.github.com/repos/'+S.repo+path,{headers:headers(),cache:'no-store'}).then(function(res){
      var rem=res.headers.get('x-ratelimit-remaining'), lim=res.headers.get('x-ratelimit-limit');
      if(rem!==null) S.rate='طلبات متبقية: '+rem+'/'+lim;
      if(!res.ok){
        return res.text().then(function(t){
          var msg=''; try{ msg=JSON.parse(t).message||''; }catch(e){}
          var e=new Error(res.status+' '+msg); e.status=res.status; throw e;
        });
      }
      return res.json();
    });
  }

  function saveArt(){
    var keys=Object.keys(S.art);
    if(keys.length>80){ keys.sort(function(a,b){return a-b;}).slice(0,keys.length-80).forEach(function(k){ delete S.art[k]; }); }
    LS.set('jaw_art',JSON.stringify(S.art));
  }

  function loadArtifacts(runs){
    var need=runs.filter(function(r){ return kind(r)==='success' && !S.art[r.id]; });
    if(!need.length) return Promise.resolve();
    return Promise.all(need.map(function(r){
      return api('/actions/runs/'+r.id+'/artifacts?per_page=10').then(function(j){
        S.art[r.id]=(j.artifacts||[]).map(function(a){ return {id:a.id,name:a.name,size:a.size_in_bytes,expired:!!a.expired}; });
      }).catch(function(){ /* هنحاول تاني في التحديث الجاي */ });
    })).then(saveArt);
  }

  function refresh(){
    if(S.busy) return Promise.resolve();
    if(!/^[\w.-]+\/[\w.-]+$/.test(S.repo)){ $('cfg').style.display='block'; showErr('اكتب المستودع بالشكل owner/repo'); return Promise.resolve(); }
    S.busy=true; $('refresh').classList.add('spin');
    return api('/actions/runs?per_page='+S.count).then(function(j){
      S.runs=(j.workflow_runs||[]).slice(0,S.count);
      return loadArtifacts(S.runs);
    }).then(function(){
      S.last=Date.now(); showErr(''); render();
    }).catch(function(e){
      var m=e.message||String(e);
      if(e.status===404) m+='\nالمستودع مش موجود أو برايفت — حط token في ⚙.';
      else if(e.status===401) m+='\nالتوكن غلط أو منتهي.';
      else if(e.status===403) m+='\nغالبًا وصلت حد الطلبات — حط token أو زوّد فترة التحديث.';
      else if(/Failed to fetch|NetworkError/i.test(m)) m='مفيش اتصال بـ api.github.com';
      showErr(m); render();
    }).then(function(){ S.busy=false; $('refresh').classList.remove('spin'); schedule(); });
  }

  function showErr(m){ $('err').innerHTML = m ? '<div class="msg">'+esc(m)+'</div>' : ''; }

  function linkDownload(r){
    var a=S.art[r.id];
    if(!a) return '<span class="btn off">⬇ …</span>';
    if(!a.length) return '<span class="btn off">مفيش artifact</span>';
    var base='https://github.com/'+S.repo+'/suites/'+r.check_suite_id+'/artifacts/';
    return a.map(function(x){
      if(x.expired) return '<span class="btn off" title="'+esc(x.name)+'">انتهت</span>';
      var mb=x.size?(' · '+(x.size/1048576).toFixed(0)+'MB'):'';
      var lbl=a.length>1?esc(x.name.slice(0,16)):'تحميل';
      return '<a class="btn dl" target="_blank" rel="noopener" href="'+base+x.id+'" title="'+esc(x.name)+mb+'">⬇ '+lbl+'</a>';
    }).join('');
  }
  function linkLogs(r){
    return '<a class="btn lg" target="_blank" rel="noopener" href="https://github.com/'+S.repo+'/actions/runs/'+r.id+'/logs" title="تحميل أرشيف اللوج (zip)">⬇ لوج</a>';
  }

  function render(){
    var box=$('list');
    if(!S.runs.length){ box.innerHTML='<div class="empty">'+(S.last?'مفيش runs':'—')+'</div>'; titleStatus(); return; }
    box.innerHTML=S.runs.map(function(r){
      var k=kind(r), no=fileNo(r);
      var msg=(r.display_title||(r.head_commit&&r.head_commit.message)||'').split('\n')[0];
      var st, extra='';
      if(k==='running'){
        var t0=new Date(r.run_started_at||r.created_at).getTime();
        st='<span class="st pulse">⏳ '+(r.status==='queued'?'في الطابور':'شغّال')+'</span>';
        extra=' · <span data-run="'+t0+'">'+dur((Date.now()-t0)/1000)+'</span>';
      } else {
        var d=(new Date(r.updated_at)-new Date(r.run_started_at||r.created_at))/1000;
        st = k==='success' ? '<span class="st">✅ نجح</span>' : k==='gray' ? '<span class="st" style="color:var(--gray)">⊘ '+esc(r.conclusion==='cancelled'?'اتلغى':'اتخطّى')+'</span>' : '<span class="st">❌ فشل</span>';
        extra=' · '+dur(d)+' · '+sinceTxt(r.updated_at);
      }
      var acts = k==='success' ? linkDownload(r) : (k==='failure'||(k==='gray'&&r.conclusion==='cancelled')) ? linkLogs(r) : '';
      return '<div class="run '+k+'">'+
        '<div class="num">'+(no?esc(no):'#'+r.run_number)+'<small>'+(no?'ملف':'run')+'</small></div>'+
        '<div class="mid"><div class="t" title="'+esc(msg)+'">'+esc(msg||r.name)+'</div>'+
        '<div class="s">'+st+extra+' · '+esc(r.name||'')+'</div></div>'+
        '<div class="acts">'+acts+'</div></div>';
    }).join('');
    $('rate').textContent=S.rate;
    titleStatus();
  }

  function titleStatus(){
    var r=S.runs[0]; if(!r){ document.title='Joyboy Actions'; return; }
    var k=kind(r), no=fileNo(r)||('#'+r.run_number);
    document.title=(k==='success'?'✅ ':k==='failure'?'❌ ':k==='running'?'⏳ ':'⊘ ')+no+' — Joyboy Actions';
  }

  function schedule(){
    if(S.timer){ clearTimeout(S.timer); S.timer=null; }
    var iv=S.interval;
    if(!iv) return;
    if(!S.tok && iv<90) iv=90;                                    // من غير token الحد 60 طلب/ساعة
    var running=S.runs.some(function(r){ return r.status!=='completed'; });
    if(running && S.tok) iv=Math.min(iv,20);                      // فيه بيلد شغّال: تحديث أسرع
    S.timer=setTimeout(refresh, iv*1000);
  }

  // عدّاد «آخر تحديث» + عدّاد الـ runs الشغّالة — كل ثانية
  setInterval(function(){
    $('ago').textContent = S.last ? agoTxt(Date.now()-S.last) : '—';
    var els=document.querySelectorAll('[data-run]');
    for(var i=0;i<els.length;i++) els[i].textContent=dur((Date.now()-parseInt(els[i].getAttribute('data-run'),10))/1000);
  },1000);

  // ===== إعدادات =====
  function fillCfg(){ $('cRepo').value=S.repo; $('cTok').value=S.tok; $('cInt').value=String(S.interval); $('cCnt').value=String(S.count); $('repoLbl').textContent=S.repo; }
  $('gear').onclick=function(){ var c=$('cfg'); c.style.display=c.style.display==='block'?'none':'block'; };
  $('cClose').onclick=function(){ $('cfg').style.display='none'; };
  $('cSave').onclick=function(){
    S.repo=$('cRepo').value.trim(); S.tok=$('cTok').value.trim();
    S.interval=parseInt($('cInt').value,10); S.count=parseInt($('cCnt').value,10);
    LS.set('jaw_repo',S.repo); LS.set('jaw_tok',S.tok); LS.set('jaw_int',String(S.interval)); LS.set('jaw_cnt',String(S.count));
    S.runs=[]; S.last=0; fillCfg(); $('cfg').style.display='none'; refresh();
  };
  $('refresh').onclick=function(){ refresh(); };
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && S.last && Date.now()-S.last>20000) refresh(); });

  $('foot').textContent='Joyboy Actions widget';
  fillCfg(); refresh();
})();
</script>
</body>
</html>
