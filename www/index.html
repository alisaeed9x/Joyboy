<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Continuity AI</title>
<style>
:root{--bg:#faf9f6;--surface:#fff;--surface2:#f1efe9;--text:#1f1f1e;--muted:#6d6b66;--border:#e4e1d8;--accent:#2f6f6a;--accent-t:#fff;--danger:#b3372f;--warn:#a96a12;--ok:#2d7a45;--r:14px;--shadow:0 1px 3px rgba(0,0,0,.08);--font:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,"Noto Sans Arabic",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
[data-theme=dark]{--bg:#1c1c1b;--surface:#262625;--surface2:#30302e;--text:#ecebe7;--muted:#a09e97;--border:#3a3a37;--accent:#5ab3aa;--accent-t:#102220;--danger:#e8776f;--warn:#e0a54f;--ok:#6cc487;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px}
button:hover{background:var(--surface2)}
button.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button.dng{color:var(--danger)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-height:40px}
textarea{resize:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
#app{display:flex;height:100%}
#side{width:290px;flex:none;background:var(--surface2);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:8px;overflow:hidden}
.brand{font-weight:700;font-size:18px;padding:4px 6px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;display:block}
#side .nav{display:flex;flex-direction:column;gap:2px}
#side .nav button{text-align:start;border:0;background:transparent;display:flex;gap:8px;align-items:center}
#side .nav button.on{background:var(--surface);box-shadow:var(--shadow)}
#recent{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
#recent h4{margin:10px 6px 4px;font-size:12px;color:var(--muted);font-weight:600}
.ci{border:0;background:transparent;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%}
.ci.on{background:var(--surface)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);min-height:56px}
header .ttl{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font-size:12px;color:var(--muted);white-space:nowrap}
#menu-btn{display:none}
#model-btn{max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{flex:1;overflow:auto;padding:16px}
.wrap{max-width:780px;margin:0 auto}
.thread{display:flex;flex-direction:column;gap:18px;padding-bottom:12px}
.msg .bub{background:var(--surface2);border-radius:var(--r);padding:10px 14px;max-width:92%;width:fit-content;margin-inline-start:auto}
.msg.user .bub{margin-inline-start:0;margin-inline-end:auto}
html[dir=rtl] .msg.user .bub{margin-inline-start:0}
.msg.user{display:flex;justify-content:flex-start}
.msg.asst .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.body p{margin:.4em 0}.body h1,.body h2,.body h3{margin:.8em 0 .3em;line-height:1.3}
.body h1{font-size:1.3em}.body h2{font-size:1.15em}.body h3{font-size:1.05em}
.body ul,.body ol{margin:.4em 0;padding-inline-start:1.4em}
.body code{font-family:var(--mono);background:var(--surface2);padding:1px 5px;border-radius:6px;font-size:.9em}
.code{border:1px solid var(--border);border-radius:10px;margin:.6em 0;overflow:hidden;background:var(--surface)}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:2px 10px;background:var(--surface2);font-size:12px;color:var(--muted)}
.code .ch button{min-height:28px;padding:2px 8px;font-size:12px}
.code pre{margin:0;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.5;direction:ltr;text-align:left;white-space:pre}
.acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.acts button{min-height:32px;padding:2px 10px;font-size:13px}
.note{font-size:13px;color:var(--warn);background:var(--surface2);border-radius:10px;padding:6px 12px;text-align:center}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:14px}
.cur::after{content:"▍";animation:bl 1s infinite;color:var(--accent)}
@keyframes bl{50%{opacity:0}}
.empty{text-align:center;color:var(--muted);margin-top:12vh}
.empty h2{color:var(--text);margin:0 0 6px}
#composer{border-top:1px solid var(--border);padding:10px 12px;background:var(--bg)}
#composer .box{max-width:780px;margin:0 auto;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
#composer textarea{border:0;background:transparent;max-height:180px;padding:6px 8px}
#composer textarea:focus{outline:0}
#composer .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
.chip{font-size:12px;background:var(--surface2);border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-of-type{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:end}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);font-weight:500}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--danger)}.badge.est{color:var(--warn)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.page-h h2{margin:0;font-size:20px}
.muted{color:var(--muted);font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.on{display:flex}
.sheet{background:var(--bg);border-radius:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px;border:1px solid var(--border)}
.sheet h3{margin:0 0 8px}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.chk input{width:auto;min-height:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));inset-inline:0;display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast div{background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s}
#toast.on div{opacity:1}
#dots{display:none;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.dot{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;font-weight:700;flex:none;border:2px solid var(--border);color:var(--muted)}
.dot.g{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.r{background:var(--danger);border-color:var(--danger);color:#fff}
.dot.a{background:var(--warn);border-color:var(--warn);color:#fff}
.dot.p{animation:bl 1s infinite}
.dot.act{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
details.lg{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface)}
details.lg summary{padding:8px 12px;cursor:pointer;font-size:14px}
details.lg pre{margin:0;padding:8px 12px;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;border-top:1px dashed var(--border);max-height:40vh;overflow:auto;direction:ltr;text-align:left}
details.lg h5{margin:8px 12px 0;font-size:12px;color:var(--muted)}
#b-mic.rec{background:var(--danger);color:#fff;border-color:var(--danger)}
.thumb{height:64px;border-radius:8px;margin:2px;cursor:pointer}
.chip img{height:22px;border-radius:4px}
#scrim{display:none}
@media(max-width:820px){
 #menu-btn{display:inline-flex}
 #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:40;width:84vw;max-width:320px;transform:translateX(-105%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top))}
 html[dir=rtl] #side{transform:translateX(105%)}
 #side.open{transform:none!important}
 #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
 .sheet{align-self:flex-end;border-end-start-radius:0;border-end-end-radius:0}
 #modal{align-items:flex-end;padding:0}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="scrim" data-act="side"></div>
  <main>
    <header id="hdr"></header>
    <div id="dots"></div>
    <section id="view"></section>
    <footer id="composer">
      <div class="box">
        <div id="chips"></div>
        <textarea id="inp" rows="1"></textarea>
        <div class="row">
          <div><button class="ghost" data-act="attach" id="b-att">📎</button><button class="ghost" data-act="mic" id="b-mic">🎤</button><input type="file" id="file" accept="image/*,video/*,audio/*,application/pdf,text/*,.txt,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.kt,.java,.sql,.sh,.ini" multiple hidden></div>
          <button class="pri" id="b-send" data-act="send">↑</button>
        </div>
      </div>
    </footer>
  </main>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"><div></div></div>

/* ====================== storage (IndexedDB) ====================== */
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('continuity-ai',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(m,f)=>{const d=await open();return new Promise((res,rej)=>{const x=d.transaction('kv',m);const q=f(x.objectStore('kv'));x.oncomplete=()=>res(q&&q.result);x.onerror=()=>rej(x.error)})};
return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),clear:()=>tx('readwrite',s=>s.clear()),del:k=>tx('readwrite',s=>s.delete(k))}})();

/* ====================== secrets (AES-GCM, non-extractable key) ====================== */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aesKey(){let k=await idb.get('aeskey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await idb.set('aeskey',k)}return k}
async function encSecret(txt){const k=await aesKey();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));return{iv:b64(iv),ct:b64(ct)}}
async function decSecret(o){const k=await aesKey();const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct));return new TextDecoder().decode(pt)}

/* ====================== markdown (safe, minimal) ====================== */
function md(src){
 const blocks=[];const blk=(l,c)=>{blocks.push(`<div class="code"><div class="ch"><span>${esc(l||'code')}</span><button data-act="copycode">${t('copy')}</button></div><pre>${esc(c.replace(/\n$/,''))}</pre></div>`);return `\u0000${blocks.length-1}\u0000`};
 let s=String(src||'').replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,l,c)=>blk(l,c)).replace(/```([\w+-]*)\n?([\s\S]*)$/,(_,l,c)=>blk(l,c));
 s=esc(s);
 const inl=x=>x.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 const out=[];let list=null,para=[];
 const flushP=()=>{if(para.length){out.push('<p>'+inl(para.join('<br>'))+'</p>');para=[]}};
 const flushL=()=>{if(list){out.push(`<${list.t}>`+list.i.map(i=>'<li>'+inl(i)+'</li>').join('')+`</${list.t}>`);list=null}};
 for(const ln of s.split('\n')){let m;
  if(m=ln.match(/^(#{1,3})\s+(.*)$/)){flushP();flushL();out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`)}
  else if(m=ln.match(/^\s*[-*]\s+(.*)$/)){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',i:[]}}list.i.push(m[1])}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',i:[]}}list.i.push(m[1])}
  else if(!ln.trim()){flushP();flushL()}
  else if(/^\u0000\d+\u0000$/.test(ln.trim())){flushP();flushL();out.push(ln.trim())}
  else{flushL();para.push(ln)}}
 flushP();flushL();
 return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[+i]);
}

const PRESETS={
 anthropic:{name:'Anthropic (Claude)',type:'anthropic',base:'https://api.anthropic.com/v1'},
 openai:{name:'OpenAI',type:'openai',base:'https://api.openai.com/v1'},
 openrouter:{name:'OpenRouter',type:'openai',base:'https://openrouter.ai/api/v1'},

 local:{name:'Ollama / LM Studio (local)',type:'openai',base:'http://192.168.1.10:11434/v1'},
 custom:{name:'Custom OpenAI-compatible',type:'openai',base:''}
};
class PErr extends Error{constructor(kind,status,msg,ra){super(msg||kind);this.kind=kind;this.status=status;this.ra=ra}}
function kindOf(st){return st===401||st===403?'auth':st===429?'rate':(st===408||st>=500)?'server':'request'}
function parseDur(s){if(s==null||s==='')return NaN;if(/^[\d.]+$/.test(s))return parseFloat(s)*1000;let ms=0,m,ok=false;const re=/([\d.]+)(ms|s|m|h|d)/g;const U={ms:1,s:1e3,m:6e4,h:36e5,d:864e5};while(m=re.exec(s)){ms+=parseFloat(m[1])*U[m[2]];ok=true}return ok?ms:NaN}
function retryAfter(h){const v=h.get('retry-after');if(!v)return null;if(/^\d+$/.test(v))return +v*1000;const d=Date.parse(v);return isNaN(d)?null:Math.max(0,d-Date.now())}
async function hdrs(c){const h={'content-type':'application/json'};const k=c.enc?await decSecret(c.enc):'';if(c.type==='anthropic'){h['x-api-key']=k;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}else if(k)h.authorization='Bearer '+k;return h}
function captureLimits(c,h){const L={at:Date.now(),src:'provider'};let any=false;
 for(const [k,n] of [['requests','req'],['tokens','tok']]){let rem,lim,rs,at;
  if(c.type==='anthropic'){rem=h.get(`anthropic-ratelimit-${k}-remaining`);lim=h.get(`anthropic-ratelimit-${k}-limit`);rs=h.get(`anthropic-ratelimit-${k}-reset`);at=rs?Date.parse(rs):null}
  else{rem=h.get(`x-ratelimit-remaining-${k}`);lim=h.get(`x-ratelimit-limit-${k}`);rs=h.get(`x-ratelimit-reset-${k}`);const d=parseDur(rs);at=isNaN(d)?null:Date.now()+d}
  if(rem!=null||lim!=null||rs){L[n]={rem:rem!=null?+rem:null,lim:lim!=null?+lim:null,resetAt:at&&!isNaN(at)?at:null};any=true}}
 if(any){c.limits=L;save()}}
async function pfetch(c,path,opt={}){let r;try{const H=await hdrs(c);if(opt.form)delete H['content-type'];r=await fetch(c.base.replace(/\/+$/,'')+path,{...opt,headers:H})}catch(e){if(e.name==='AbortError')throw e;throw new PErr('network',0,e.message)}
 captureLimits(c,r.headers);
 if(!r.ok){let m='';try{const j=await r.json();m=(j.error&&(j.error.message||j.error))||j.message||''}catch(e){}throw new PErr(kindOf(r.status),r.status,String(m).slice(0,300),retryAfter(r.headers))}
 return r}
async function listModels(c){const r=await pfetch(c,c.type==='anthropic'?'/models?limit=1000':'/models');const j=await r.json();return(j.data||j.models||[]).map(m=>m.id||m.name).filter(Boolean)}
async function testConn(c){try{c.models=await listModels(c);c.status={kind:'ok',at:Date.now()};save();return true}catch(e){c.status={kind:e.kind||'request',at:Date.now(),msg:e.message};if(e.kind==='rate'&&e.ra)c.cooldownUntil=Date.now()+e.ra;save();return false}}
async function* sse(resp){const rd=resp.body.getReader(),dec=new TextDecoder();let buf='';for(;;){const{done,value}=await rd.read();if(done)break;buf=(buf+dec.decode(value,{stream:true})).replace(/\r\n/g,'\n');let i;while((i=buf.indexOf('\n\n'))>=0){yield buf.slice(0,i);buf=buf.slice(i+2)}}if(buf.trim())yield buf}
async function callStream(c,model,msgs,system,onDelta,signal,maxTok){
 let path,body;
 if(c.type==='anthropic'){path='/messages';body={model,max_tokens:maxTok||S.settings.maxTokens,stream:true,messages:msgs};if(system)body.system=system}
 else{path='/chat/completions';body={model,stream:true,stream_options:{include_usage:true},...(maxTok?{max_tokens:maxTok}:{}),messages:system?[{role:'system',content:system},...msgs]:msgs}}
 const r=await pfetch(c,path,{method:'POST',body:JSON.stringify(body),signal});
 const u={in:0,out:0};
 try{for await(const raw of sse(r)){const d=raw.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('');if(!d||d==='[DONE]')continue;let ev;try{ev=JSON.parse(d)}catch(e){continue}
  if(ev.error)throw new PErr('server',0,ev.error.message||JSON.stringify(ev.error));
  if(c.type==='anthropic'){if(ev.type==='message_start'&&ev.message&&ev.message.usage)u.in=ev.message.usage.input_tokens||0;else if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta')onDelta(ev.delta.text);else if(ev.type==='message_delta'&&ev.usage)u.out=ev.usage.output_tokens||0}
  else{const x=ev.choices&&ev.choices[0]&&ev.choices[0].delta&&ev.choices[0].delta.content;if(x)onDelta(x);if(ev.usage){u.in=ev.usage.prompt_tokens||0;u.out=ev.usage.completion_tokens||0}}}}
 catch(e){if(e instanceof PErr||e.name==='AbortError')throw e;throw new PErr('network',0,e.message)}
 return u}

const newUsage=()=>({reqs:0,succ:0,fail:0,inTok:0,outTok:0,cost:0});
function modelFor(c,ch){if(ch&&ch.connId===c.id&&ch.model&&(c.allowed||[]).includes(ch.model))return ch.model;return(c.defModel&&(c.allowed||[]).includes(c.defModel))?c.defModel:(c.allowed||[])[0]}
function usable(c,ch){return c.enabled&&(c.type!=='anthropic'||c.enc)&&!(c.cooldownUntil>Date.now())&&!(c.status&&c.status.kind==='auth')&&!(c.budget&&c.usage.cost>=c.budget)&&!!modelFor(c,ch)}
const rel=c=>{const n=c.usage.succ+c.usage.fail;return n?c.usage.succ/n:.5};
const priceOf=c=>c.price&&(c.price.in||c.price.out)?(+c.price.in||0)+(+c.price.out||0):Infinity;
function plan(ch,exclude=[]){
 const all=S.conns.filter(c=>usable(c,ch)&&!exclude.includes(c.id));const mode=S.settings.route;
 const byPri=[...all].sort((a,b)=>a.priority-b.priority);let list,why;
 if(mode==='reliability'){list=[...byPri].sort((a,b)=>rel(b)-rel(a));why='rRel'}
 else if(mode==='cost'){list=[...byPri].sort((a,b)=>priceOf(a)-priceOf(b));why='rCost'}
 else if(mode==='priority'){list=byPri;why='rPri'}
 else{const first=all.find(c=>c.id===ch.connId);list=first?[first,...byPri.filter(c=>c!==first)]:byPri;why='rMan'}
 return list.map((c,i)=>({c,model:modelFor(c,ch),reason:t(i===0?why:'rPri')}))}

const readDataUrl=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});

function drawScaled(src,w,h,max,q){const k=Math.min(1,max/Math.max(w,h));const cw=Math.round(w*k),ch=Math.round(h*k);const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);return cv.toDataURL('image/jpeg',q)}

document.addEventListener('change',e=>{const x=e.target;
 if(x.id==='fb'){S.settings.fallback=x.checked;save()}
 if(x.id==='st-c'||x.id==='st-m'||x.id==='st-model'){S.settings.stt=S.settings.stt||{};S.settings.stt[x.id==='st-c'?'connId':x.id==='st-m'?'mode':'model']=x.value.trim();save()}
 if(x.id==='at'){S.settings.autoTest=x.checked;save()}
 if(x.id==='mt'){S.settings.maxTokens=Math.max(256,parseInt(x.value)||4096);save()}
 if(x.id==='sy'){S.settings.system=x.value;save()}
 if(x.id==='file'){const fs=[...x.files];x.value='';addFiles(fs)}});
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendMsg()}});

/* ====================== boot ====================== */
(async function boot(){
 try{S=await idb.get('state')}catch(e){}
 if(!S||S.v!==1)S=DEF();
 S.conns.forEach(c=>{c.usage=c.usage||newUsage();c.allowed=c.allowed||[]});
 S.chats.forEach(ch=>ch.msgs.forEach(m=>{if(m.streaming){m.streaming=false;m.partial=!!m.content;if(!m.content&&!m.err)m.err={kind:'network',text:t('partial')}}}));
 if(!S.cur||!chat())S.cur=S.chats[0]?S.chats[0].id:null;
 S.log=S.log||[];
 render();
 if(S.settings.autoTest!==false&&S.conns.length)pingAll();
})();
</script>
</body>
</html>
